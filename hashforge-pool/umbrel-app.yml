manifestVersion: 1
id: hashforge-pool
storage:
  dataRoot: data
category: bitcoin
name: HashForge
version: "0.1.7"
tagline: Run your own Bitcoin mining pool, solo or shared
description: >-
  HashForge is an open-source Bitcoin mining pool that runs on your own node. Point your miners at your
  Umbrel instead of someone else's pool: if one of them finds a block, the reward is paid by the block
  itself, straight to the miner's own Bitcoin address. The pool never holds anyone's bitcoin.


  On umbrelOS, HashForge connects to your Bitcoin Node app automatically and starts with a solo pool
  that charges no fee. Open the app, go to the Connect page, and point your miner at the address shown
  there, using your own Bitcoin address as the user name. Mining begins once your node has finished
  synchronising.


  Features:


  - Solo mining out of the box: whoever finds the block keeps the whole reward

  - Shared pools for friends and family: PPLNS, proportional and finder-bonus payouts, each on its own port

  - Live statistics for every pool, miner and worker, with hashrate charts and best shares

  - A record of every block found, with links to a public block explorer

  - An admin page for adding pools and setting fees, with no files to edit, protected by a password
  that umbrelOS creates for you


  On umbrelOS a shared pool pays at most ten miners in each block, the ten with the most work, so that
  its blocks always fit within the space your Bitcoin node reserves for them.
releaseNotes: >-
  A pool you stop on the admin page now stays stopped, through restarts and updates, until you press
  Start there. Before, the solo pool came back at the next restart, and a pool you had created was
  deleted when stopped. Pools you created can be deleted once stopped, and a stopped shared pool keeps
  the work its miners have handed in.

developer: Owen Ashurst
website: https://github.com/owenashurst/HashForge
dependencies:
  - bitcoin
repo: https://github.com/owenashurst/HashForge
support: https://github.com/owenashurst/HashForge/issues

